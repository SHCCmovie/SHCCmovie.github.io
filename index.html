<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖心線上觀影站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2rem; font-weight: 600; letter-spacing: 2px; color: #f0b429; }
        header p { color: #8b949e; margin-top: 8px; font-size: 0.95rem; }
        .video-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
        }
        /* 这是确保视频占满框架的样式 */
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper video {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: 0;
        }
        .comments-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 30px 25px;
        }
        .comments-section h2 {
            font-size: 1.25rem; margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid #30363d; color: #f0b429; font-weight: 500;
        }
        footer { text-align: center; margin-top: 40px; color: #484f58; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>聖心線上觀影站</h1>
            <p>不要讓看不完的電影和飛逝的時間成為遺憾</p>
        </header>

        <!-- 公告栏 -->
        <div style="background-color: #1f2937; border-left: 4px solid #f0b429; padding: 15px; margin-bottom: 30px; border-radius: 4px;">
            <strong>📢 公告：</strong>11月17日及20日將會舉辦線下觀影！
        </div>

        <div class="video-section">
            <!-- 切换按钮，你可以根据你上传的视频改名，比如“电影一：沙丘” -->
            <div style="display: flex; gap: 10px; padding: 15px; background-color: #0d1117; border-bottom: 1px solid #30363d;">
                <button onclick="changeVideo('video1')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #30363d; color: white; border: none; border-radius: 5px;">🎬 电影一</button>
                <button onclick="changeVideo('video2')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #30363d; color: white; border: none; border-radius: 5px;">🎬 电影二</button>
            </div>

            <div class="video-wrapper">
                <!-- 这是真正的 HTML5 视频播放器 -->
                <video id="myVideo" controls>
                    <!-- 这里填第一个视频的链接 -->
                    <source id="videoSource" src="archive.org/details/shccmovie.the.shining" type="video/mp4">
                    你的浏览器不支持视频播放。
                </video>
            </div>
        </div>

        <div class="comments-section">
            <h2>討論區</h2>
            <!-- 你的 Giscus 代码，安全保留 -->
            <script src="https://giscus.app/client.js"
                data-repo="SHCCmovie/SHCCmovie.github.io"
                data-repo-id="R_kgDOVVzxlA"
                data-category="Announcements"
                data-category-id="DIC_kwDOVVzxlM4DJgF1"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="1"
                data-emit-metadata="0"
                data-input-position="top"
                data-theme="catppuccin_mocha"
                data-lang="zh-CN"
                crossorigin="anonymous"
                async>
            </script>
        </div>

        <footer>
            <p>僅供聖心內部影迷使用，請勿外傳</p>
        </footer>
    </div>

    <!-- 切换视频的按钮逻辑 -->
    <script>
        function changeVideo(videoId) {
            const videoPlayer = document.getElementById('myVideo');
            const videoSource = document.getElementById('videoSource');
            
            if (videoId === 'video1') {
                archive.org/details/shccmovie.the.shining
                videoSource.src = "archive.org/details/shccmovie.the.shining"; 
            } else if (videoId === 'video2') {
                archive.org/details/shccmovie.obsession
                videoSource.src = "archive.org/details/shccmovie.obsession"; 
            }
            
            // 切换链接后，让播放器重新加载新视频
            videoPlayer.load(); 
        }
    </script>
</body>
</html>
