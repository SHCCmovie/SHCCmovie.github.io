<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖心線上觀影站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2rem; font-weight: 600; letter-spacing: 2px; color: #f0b429; }
        header p { color: #8b949e; margin-top: 8px; font-size: 0.95rem; }
        .video-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 40px;
        }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: 0;
        }
        .comments-section {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 30px 25px;
        }
        .comments-section h2 {
            font-size: 1.25rem; margin-bottom: 20px; padding-bottom: 12px;
            border-bottom: 1px solid #30363d; color: #f0b429; font-weight: 500;
        }
        footer { text-align: center; margin-top: 40px; color: #484f58; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>聖心線上觀影站</h1>
            <p>不要讓看不完的電影和飛逝的時間成為遺憾</p>
        </header>

        <!-- 这里是新增的公告栏 -->
        <div style="background-color: #1f2937; border-left: 4px solid #f0b429; padding: 15px; margin-bottom: 30px; border-radius: 4px;">
            <strong>📢 公告：</strong>11月17日及20日將會舉辦線下觀影！
        </div>

        <div class="video-section">
            <!-- 这里是新增的切换按钮 -->
            <div style="display: flex; gap: 10px; padding: 15px; background-color: #0d1117; border-bottom: 1px solid #30363d;">
                <button onclick="changeVideo('video1')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #30363d; color: white; border: none; border-radius: 5px;">🎬 电影一：测试视频</button>
                <button onclick="changeVideo('video2')" style="flex: 1; padding: 10px; cursor: pointer; background-color: #30363d; color: white; border: none; border-radius: 5px;">🎬 电影二：备用视频</button>
            </div>

            <div class="video-wrapper">
                <!-- 注意：这里加了一个 id="myVideo" -->
                <iframe id="myVideo" src="https://player.bilibili.com/player.html?bvid=你第一个B站视频的BV号" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe>
            </div>
        </div>

        <div class="comments-section">
            <h2>討論區</h2>
            <script src="https://giscus.app/client.js"
        data-repo="SHCCmovie/SHCCmovie.github.io"
        data-repo-id="R_kgDOVVzxlA"
        data-category="Announcements"
        data-category-id="DIC_kwDOVVzxlM4DJgF1"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="catppuccin_mocha"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
            </script>
        </div>

        <footer>
            <p>僅供聖心內部影迷使用，請勿外傳</p>
        </footer>
    </div>

    <!-- 新增的切换逻辑代码 -->
    <script>
        function changeVideo(videoId) {
            const iframe = document.getElementById('myVideo');
            if (videoId === 'video1') {
                // 把下面的链接换成你第一个电影的嵌入链接
                iframe.src = "https://player.bilibili.com/player.html?bvid=BV1fVHw6oEUp"; 
            } else if (videoId === 'video2') {
                // 把下面的链接换成你第二个电影的嵌入链接
                iframe.src = "https://player.bilibili.com/player.html?bvid=BV1ap4k6rE3Q"; 
            }
        }
    </script>
</body>
    </div>
</body>
</html>
